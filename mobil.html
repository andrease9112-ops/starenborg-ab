<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starenborg – mobilvy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 24px 12px;
      background: #0a1520;
      color: #e6c49a;
      font: 14px/1.4 system-ui, sans-serif;
    }
    h1 {
      margin: 0;
      font: 600 1rem/1.3 Georgia, serif;
      text-align: center;
    }
    .phone {
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 96px));
      border: 10px solid #1a2c38;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px #0008;
      background: #071a25;
    }
    .phone iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #071a25;
    }
    p { margin: 0; opacity: .75; text-align: center; max-width: 390px; }
    a { color: #f4dfbf; }
  </style>
</head>
<body>
  <h1>Mobil förhandsvisning</h1>
  <div class="phone">
    <iframe
      title="Starenborg mobil"
      src="./index.html#transport"
    ></iframe>
  </div>
  <p>
    Öppnas i en 390px-ram.
    <a href="./index.html#transport">Direktlänk till sidan</a>
  </p>
</body>
</html>
