<script>
const meetingHelp=["Rådgivning","Bokföring","Årsbokslut","Moms"];
const localDate=(d)=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
const swedishDate=new Intl.DateTimeFormat("sv-SE",{dateStyle:"long",timeZone:"Europe/Stockholm"});
const stockholmToday=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Stockholm"}).format(new Date());
function messageFields(){
 return `<label>Namn<input name="name" required maxlength="120" autocomplete="name"></label>
 <label>E-post<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
 <label class="message-label">Meddelande<textarea name="message" maxlength="3000" required></textarea></label>
 <label class="contact-trap" aria-hidden="true">Webbplats<input name="website" tabindex="-1" autocomplete="off"></label>`;
}
function contactPage(){
 const topics=meetingHelp.map(topic=>`<label><input type="checkbox" name="topic" value="${topic}"> ${topic}</label>`).join("");
 return `<section class="section contact-layout"><div class="shell">
 <section class="contact-message"><h2>Skicka ett meddelande</h2><form id="contactForm">${messageFields()}<button class="btn">Skicka meddelande</button><p role="status"></p></form></section>
 <section class="contact-meeting"><h2>Boka möte</h2><form id="bookingForm">
 <fieldset class="topic-options"><legend>Boka möte för att få hjälp med:</legend>${topics}</fieldset>
 <div class="booking-toolbar"><button type="button" id="prevMonth" aria-label="Föregående månad">‹</button><strong id="bookingMonth"></strong><button type="button" id="nextMonth" aria-label="Nästa månad">›</button></div>
 <div class="booking-grid" id="bookingDays" aria-label="Bokningskalender"></div>
 <p id="calendarStatus"></p>
 <div id="bookingDetails" hidden>
 <p id="availablePerson"></p>
 <div class="booking-book">
 <label>Namn<input name="name" required maxlength="120" autocomplete="name"></label>
 <label>E-post<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
 <button class="btn" type="submit">Boka</button>
 </div>
 <p role="status"></p>
 </div></form></section>
 </div></section>`;
}
async function contactRequest(action,data={}){
 const client=db();
 if(!client)throw new Error("Kontakttjänsten är inte ansluten.");
 const {data:result,error}=await client.functions.invoke("starenborg-contact",{body:{action,...data}});
 if(error){
  let reason;
  try{reason=(await error.context?.json())?.error}catch{}
  throw new Error(reason || "Tjänsten kunde inte nås. Försök igen.");
 }
 return result;
}
function initContactPage(){
 const calendar=document.getElementById("bookingDays");
 if(!calendar)return;
 const booking=document.getElementById("bookingForm"), status=document.getElementById("calendarStatus");
 const details=document.getElementById("bookingDetails"), personLine=document.getElementById("availablePerson");
 const [year,monthNumber]=stockholmToday().split("-").map(Number);
 let month=new Date(year,monthNumber-1,1), selected="", selectedPerson="", request=0;
 function openDay(date,person,button){
  calendar.querySelector('[aria-pressed="true"]')?.setAttribute("aria-pressed","false");
  button.setAttribute("aria-pressed","true");
  selected=date;selectedPerson=person;
  details.hidden=false;
  personLine.textContent=person+" är tillgänglig "+swedishDate.format(new Date(date+"T12:00:00Z"))+".";
  booking.elements.name.focus();
 }
 async function showMonth(){
  const id=++request;
  details.hidden=true;selected="";selectedPerson="";personLine.textContent="";
  const start=localDate(month);
  document.getElementById("bookingMonth").textContent=month.toLocaleDateString("sv-SE",{year:"numeric",month:"long"});
  calendar.innerHTML="Mån Tis Ons Tor Fre Lör Sön".split(" ").map(d=>`<span>${d}</span>`).join("");
  status.textContent="Hämtar bokningsbara dagar…";
  let days=[], loadError="";
  try{days=(await contactRequest("days",{month:start})).days||[]}catch(error){loadError=error.message}
  if(id!==request || !calendar.isConnected)return;
  const open=new Map(days.map(entry=>typeof entry==="string"?[entry,"Jessica"]:[entry.day||entry.date, entry.person||entry.advisor||entry.name||"Jessica"]));
  if(loadError){
   const today=stockholmToday();
   const last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
   for(let day=1;day<=last;day++){
    const date=localDate(new Date(month.getFullYear(),month.getMonth(),day));
    const weekday=new Date(month.getFullYear(),month.getMonth(),day).getDay();
    if(date>=today && weekday!==0 && weekday!==6)open.set(date,"Jessica");
   }
  }
  status.textContent=open.size?"":"Inga bokningsbara dagar den här månaden.";
  for(let i=0;i<(month.getDay()+6)%7;i++)calendar.append(document.createElement("span"));
  const count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
  for(let day=1;day<=count;day++){
   const date=localDate(new Date(month.getFullYear(),month.getMonth(),day));
   const person=open.get(date);
   const button=document.createElement("button");
   button.type="button";button.disabled=!person;
   button.className="booking-day"+(person?" available":"");
   button.innerHTML=`<span class="day-num">${day}</span>${person?'<span class="day-open" aria-hidden="true"></span>':""}`;
   button.setAttribute("aria-label",swedishDate.format(new Date(date+"T12:00:00Z"))+(person?", ledig tid, "+person+" är tillgänglig":""));
   button.setAttribute("aria-pressed","false");calendar.append(button);
   if(person)button.onclick=()=>openDay(date,person,button);
  }
 }
 function changeMonth(amount){month=new Date(month.getFullYear(),month.getMonth()+amount,1);showMonth()}
 document.getElementById("prevMonth").onclick=()=>changeMonth(-1);
 document.getElementById("nextMonth").onclick=()=>changeMonth(1);
 for(const form of [document.getElementById("contactForm"),booking]){
  form.onsubmit=async(event)=>{
   event.preventDefault();
   const fields=new FormData(form), output=form.querySelector("[role=status]");
   const submit=form.querySelector("button.btn");
   const data=Object.fromEntries(fields);data.topics=fields.getAll("topic");data.date=selected;
   if(form===booking){
    if(!selected){output.textContent="Välj ett datum med ledig tid.";return}
    if(!data.topics.length){output.textContent="Välj minst ett alternativ.";return}
    data.advisor=selectedPerson;
    data.teams=true;
    data.attendees=[data.email,selectedPerson];
   }
   submit.disabled=true;output.textContent=form===booking?"Skickar Teams-inbjudan…":"Skickar…";
   try{
    const result=await contactRequest(form===booking?"book":"contact",data);form.reset();
    if(form===booking){await showMonth();status.textContent=result.message||"Mötet är bokat och Teams-inbjudan är skickad."}else output.textContent=result.message;
   }catch(error){output.textContent=form===booking && /nås|ansluten/i.test(error.message)?"Teams-inbjudan kunde inte skickas. Bokningen är inte kopplad till Microsoft 365 än.":error.message}
   finally{submit.disabled=false}
  };
 }
 showMonth();
}
async function renderContactSettings(pane){
 pane.innerHTML='<h3>Kontakt och möten</h3><p role="status">Hämtar inställningar…</p>';
 try{
  const {recipient,days}=await contactRequest("settings");
  if(!pane.isConnected)return;
  pane.innerHTML=`<h3>Kontakt och möten</h3><form id="contact-recipient"><label>Mottagare för meddelanden och bokningar<input name="recipient" type="email" required value="${safe(recipient)}"></label><button>Spara mottagare</button></form>
   <form id="contact-availability"><label>Bokningsbar dag<input name="date" type="date" required min="${stockholmToday()}"></label><button>Lägg till dag</button></form>
   <p role="status"></p><ul>${days.map(({day,booked,booking})=>`<li>${safe(day)} ${booked?`(bokad) <details><summary>${safe(booking.name)}</summary><p>${safe(booking.email)}</p><p>${safe(booking.topics.join(", "))}</p><p>${safe(booking.message)}</p></details>`:`<button type="button" data-remove-date="${safe(day)}">Ta bort</button>`}</li>`).join("")}</ul>`;
  const update=async(action,fields)=>{
   const status=pane.querySelector("[role=status]");
   try{await contactRequest(action,fields);await renderContactSettings(pane);pane.querySelector("[role=status]").textContent="Sparat."}
   catch(error){status.textContent=error.message}
  };
  pane.querySelector("#contact-recipient").onsubmit=e=>{e.preventDefault();update("recipient",Object.fromEntries(new FormData(e.currentTarget)))};
  pane.querySelector("#contact-availability").onsubmit=e=>{e.preventDefault();update("add-day",Object.fromEntries(new FormData(e.currentTarget)))};
  pane.querySelectorAll("[data-remove-date]").forEach(button=>button.onclick=()=>update("remove-day",{date:button.dataset.removeDate}));
 }catch(error){pane.querySelector("[role=status]").textContent=error.message}
}
</script>

async function adminLogin(event){
 event.preventDefault();
 const a=window.MALARDALA_AUTH;
 const form=event.currentTarget;
 const email=form.elements.email.value;
 const password=form.elements.password.value;
 const status=document.getElementById("admin-status");
 const submit=form.querySelector('button[type="submit"]');
 if(!a.client){if(status)status.textContent="Supabase-biblioteket kunde inte laddas. Prova att öppna hemsidan via HTTPS i en vanlig webbläsare.";return;}
 a.busy=true;
 if(submit){submit.disabled=true;submit.textContent="Loggar in…";}
 if(status)status.textContent="Kontrollerar inloggningen…";
 try{
  const {error}=await a.client.auth.signInWithPassword({email,password});
  if(error)throw error;
  const result=await a.client.auth.getUser();
  if(result.error)throw result.error;
  a.user=result.data.user;
  a.isAdmin=!!(a.user&&a.user.app_metadata?.role==="admin");
  if(!a.isAdmin){
    a.status="Inloggningen lyckades, men kontot saknar rollen admin i Supabase. Kontrollera SQL-ändringen och logga in igen.";
    await a.client.auth.signOut();
    a.user=null;
  }else a.status="";
 }catch(err){
  a.status="Inloggningen misslyckades: "+(err?.message||"Okänt fel");
 }finally{
  a.busy=false;
  renderPage();
  const message=document.getElementById("admin-status");
  if(message)message.textContent=a.status;
 }
}

function editableFields(page,root){
 // Element selectors are constrained to known, page-specific areas; no arbitrary HTML injection.
 const all=[...root.querySelectorAll('[data-edit-about-title],[data-edit-about-eyebrow],.hero-copy h1,.hero-copy p,.section h1,.section h2,.section h3,.section p,.section li,.monthly-intro,.card h3,.card p')];
 const result=[];let i=0;
 for(const el of all){
  if(el.closest('#portal-app,.monthly-list,.subnav-wrap'))continue;
  const text=el.textContent.trim();if(!text||text.length>3000)continue;
  const path=el.hasAttribute('data-edit-about-title')?'[data-edit-about-title]':
   el.hasAttribute('data-edit-about-eyebrow')?'[data-edit-about-eyebrow]':cssPath(el,root);
  if(!path)continue;
  result.push({selector:path,label:el.tagName+' · '+text.slice(0,65),value:editableContent[page+'|'+path]??text});
  if(++i>=90)break;
 }
 return result;
}
function cssPath(el,root){
 const parts=[];
 while(el&&el!==root){
  const parent=el.parentElement;if(!parent)return null;
  const tag=el.tagName.toLowerCase();
  const siblings=[...parent.children].filter(x=>x.tagName===el.tagName);
  parts.unshift(tag+(siblings.length>1?`:nth-of-type(${siblings.indexOf(el)+1})`:''));
  el=parent;
 }
 return ':scope > '+parts.join(' > ');
}

async function ensureWorkMailboxes(user){
 const wanted=[personalMailbox(user),{address:INFO_ADDRESS,display_name:'Info',kind:'shared',owner_id:null}];
 for(const row of wanted){
  const {data:existing,error:readErr}=await db().from('work_mailboxes').select('id,owner_id,kind').eq('address',row.address).maybeSingle();
  if(readErr)return readErr;
  if(!existing){
   const {error}=await db().from('work_mailboxes').insert(row);
   if(error)return error;
  }else if(row.kind==='personal'&&!existing.owner_id){
   const {error}=await db().from('work_mailboxes').update({owner_id:user.id,display_name:row.display_name,kind:'personal'}).eq('id',existing.id);
   if(error)return error;
  }
 }
 return null;
}

  return;
 }
 const {data,error}=await db().from('work_mailboxes').select('id,address,display_name,kind,owner_id').order('address');
 if(error){pane.innerHTML=`<h3>Inkorg</h3><p>${safe(error.message)}</p>`;return;}
 mailboxes=(data||[]).filter(box=>box.address===INFO_ADDRESS||box.owner_id===user.id);
 mailboxes.sort((a,b)=>Number(a.kind==='shared')-Number(b.kind==='shared')||a.address.localeCompare(b.address,'sv'));
 if(!mailboxes.some(box=>box.id===activeMailboxId))activeMailboxId=mailboxes[0]?.id||null;
 const current=mailboxes.find(box=>box.id===activeMailboxId);

 }
 paintInbox(pane,current,messages,async id=>{

async function sendWorkMail(e){
 e.preventDefault();
 const box=mailboxes.find(b=>b.id===activeMailboxId);
 if(!box)return;
 const f=new FormData(e.currentTarget);
 if(demoSession()&&!window.MALARDALA_AUTH.user){
  const to=String(f.get('to')||'').trim().toLowerCase();
  const subject=String(f.get('subject')||'').trim();
  const body=String(f.get('body')||'').trim();
  const store=readDemoMail();
  const stamp=new Date().toISOString();
  store.messages.push({id:'m-'+Date.now(),mailbox_id:box.id,direction:'out',from_address:box.address,to_address:to,subject,body,is_read:true,created_at:stamp});
  const dest=store.mailboxes.find(item=>item.address===to);
  if(dest&&dest.id!==box.id)store.messages.push({id:'m-'+(Date.now()+1),mailbox_id:dest.id,direction:'in',from_address:box.address,to_address:to,subject,body,is_read:false,created_at:stamp});
  writeDemoMail(store);
  mailView='out';openMessageId=null;
  renderPortal();
  statusMessage(dest?'Mejlet ligger i mottagarens inkorg. Byt konto för att läsa det.':'Mejlet är sparat i Skickat. Adressen finns inte bland övningsadresserna.');
  return;
 }
 const to=String(f.get('to')||'').trim().toLowerCase();
 const subject=String(f.get('subject')||'').trim();
 const body=String(f.get('body')||'').trim();
 const {error}=await db().from('work_messages').insert({mailbox_id:box.id,direction:'out',from_address:box.address,to_address:to,subject,body,is_read:true});
 if(error){statusMessage('Kunde inte skicka: '+error.message);return;}
 const {data:dest}=await db().from('work_mailboxes').select('id').eq('address',to).maybeSingle();
 if(dest&&dest.id!==box.id){
  const {error:inErr}=await db().from('work_messages').insert({mailbox_id:dest.id,direction:'in',from_address:box.address,to_address:to,subject,body,is_read:false});
  if(inErr){statusMessage('Mejlet sparades i Skickat, men kunde inte läggas i mottagarens inkorg: '+inErr.message);return;}
 }
 statusMessage(dest?'Mejlet är skickat till den lokala inkorgen.':'Mejlet är sparat i Skickat. Adressen finns inte bland jobbmejlen.');
 renderPortal();
}
async function portalLogin(e){

 const password=String(f.get('password')||'');

async function uploadCustomerDocument(e){
 e.preventDefault();const file=e.currentTarget.elements.file.files[0];
 if(!file||file.size>15e6){statusMessage('Filen får vara högst 15 MB.');return;}
 const path=portalCustomerId+'/'+crypto.randomUUID();
 const {error}=await db().storage.from('customer-documents').upload(path,file,{contentType:file.type||'application/octet-stream'});
 if(error){statusMessage('Uppladdning misslyckades: '+error.message);return;}
 const {error:dbError}=await db().from('customer_documents').insert({customer_id:portalCustomerId,filename:file.name,storage_path:path});
 if(dbError){await db().storage.from('customer-documents').remove([path]);statusMessage('Kunde inte registrera dokumentet: '+dbError.message);return;}
 statusMessage('Dokumentet är uppladdat.');renderPortal();
}
async function downloadCustomerDocument(id){
 const d=portalDocs.find(x=>x.id===id);if(!d)return;
 const {data,error}=await db().storage.from('customer-documents').createSignedUrl(d.storage_path,60,{download:d.filename});
 if(error){statusMessage(error.message);return;}window.open(data.signedUrl,'_blank','noopener');
}
async function deleteCustomerDocument(id){
 if(!confirm('Ta bort dokumentet permanent?'))return;
 const d=portalDocs.find(x=>x.id===id);if(!d)return;
 const {error}=await db().storage.from('customer-documents').remove([d.storage_path]);
 if(error){statusMessage(error.message);return;}
 await db().from('customer_documents').delete().eq('id',id);renderPortal();
}

<script>
(function(){
 function updateDepartmentFade(){
  if(matchMedia("(max-width:800px)").matches){
   const edge=document.querySelector(".hero-nav")?.getBoundingClientRect().bottom
    ?? document.querySelector("#header")?.getBoundingClientRect().bottom
    ?? 0;
   document.querySelectorAll("#content > .department-scroll-copy, #content > .monthly-news, #content > .section, #content > .hero-copy, #content > .pagehead, #content > .hero-home > .pagehead, #content:has(#portal-app) > .section").forEach(copy=>{
    const band=72;
    const offset=edge-copy.getBoundingClientRect().top;
    copy.style.setProperty("--fade-start",Math.max(-band,offset)+"px");
   });
   return;
  }
  const heading=document.querySelector("#content > .pagehead");
  if(!heading)return;
  document.querySelectorAll("#content > .department-scroll-copy, #content:has(#portal-app) > .section").forEach(copy=>{
   const portal=copy.matches("#content > .section");
   const band=portal?110:72;
   const offset=heading.getBoundingClientRect().bottom-copy.getBoundingClientRect().top+(portal?18:0);
   copy.style.setProperty("--fade-start",Math.max(-band,offset)+"px");
  });
 }
 function positionDepartmentIntro(){
  const hero=document.querySelector("#content:has(.department-scroll-copy) > .hero");
  const title=document.querySelector(".department-scroll-copy .hero-title");
  if(!hero || !title){updateDepartmentFade();return;}
  title.style.removeProperty("--department-title-size");
  const line=document.createRange();
  line.selectNodeContents(title);
  const textWidth=line.getBoundingClientRect().width;
  const available=title.clientWidth;
  if(available>0 && textWidth>available){
   const size=parseFloat(getComputedStyle(title).fontSize);
   title.style.setProperty("--department-title-size",(size*(available-2)/textWidth)+"px");
  }
  const heroBox=hero.getBoundingClientRect();
  const titleBottom=title.getBoundingClientRect().bottom+window.scrollY;
  const targetBottom=document.documentElement.clientHeight-20;
  const space=Math.max(0,Math.round(heroBox.height+targetBottom-titleBottom));
  hero.style.setProperty("--department-hero-space",space+"px");
  updateDepartmentFade();
 }
 addEventListener("scroll",updateDepartmentFade,{passive:true});
 addEventListener("resize",positionDepartmentIntro);
 addEventListener("load",positionDepartmentIntro);
 addEventListener("hashchange",positionDepartmentIntro);
 positionDepartmentIntro();
})();
</script>
